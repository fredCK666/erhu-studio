    :root {

      --line: rgba(114, 75, 41, 0.08);
      --shadow: 0 24px 56px rgba(61, 39, 24, 0.12);

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 207, 92, 0.34), transparent 22%),

    a { color: inherit; text-decoration: none; }

    .shell {

      margin: 0 auto;
      padding: 18px 0 30px;

    .hero,
    .panel,
    .score-card {
      background: var(--paper);
      border: 1px solid var(--line);

      box-shadow: var(--shadow);

    .hero {

      margin-bottom: 14px;
    }

    .eyebrow {
      display: inline-flex;
      margin-bottom: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(240, 174, 62, 0.12);
      color: var(--wood);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 46px);
    }

    p, li {
      color: var(--muted);
      line-height: 1.8;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .piece-section {
      margin-bottom: 14px;
      padding: 18px 20px;
    }

    .piece-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .piece-head h2 {
      margin: 0;
      font-size: 26px;
    }

    .piece-meta {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .piece-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .piece-tab {
      border: 1px solid rgba(125, 75, 43, 0.1);
      background: rgba(255, 251, 244, 0.9);
      color: var(--wood);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .piece-tab.active {
      background: linear-gradient(135deg, #ffd66b, #e7861d);
      color: #4a2f18;
      border-color: transparent;
    }

    .panel {
      padding: 20px;
    }

    .piece-chip {
      display: inline-flex;
      margin-bottom: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(125, 75, 43, 0.1);
      color: var(--wood);
      font-size: 13px;
      font-weight: 900;
    }

    .piece-title {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .piece-description {
      margin: 0 0 16px;
    }

    .video-frame {
      overflow: hidden;
      border-radius: 20px;
      background: #18120f;
      aspect-ratio: 16 / 9;
      margin-bottom: 16px;
      width: min(100%, 860px);
    }

    .video-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .video-empty {
      margin-bottom: 16px;
      padding: 24px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255,246,232,0.96), rgba(255,237,211,0.92));
      border: 1px solid rgba(125, 75, 43, 0.08);
      color: var(--muted);
      line-height: 1.8;
    }

    .video-note {
      margin: -2px 0 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .video-help {
      margin: -8px 0 16px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(240, 174, 62, 0.12);
      color: var(--wood);
      font-size: 14px;
      line-height: 1.8;
    }

    .bullet-list,
    .task-list {
      margin: 0;
      padding-left: 20px;
    }

    .score-card {
      padding: 16px;
    }

    .score-title {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .score-box {
      margin-top: 10px;
      padding: 14px 14px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(125, 75, 43, 0.08);
      overflow-x: auto;
    }

    .score-follow-sheet {
      display: grid;
      gap: 4px;
      min-width: 1080px;
    }

    .score-follow-row {
      display: flex;
      gap: 4px;
      align-items: flex-start;
    }

    .score-follow-header {
      display: grid;
      gap: 4px;
      margin-bottom: 8px;
    }

    .score-follow-title {
      color: #2f1c13;
      font-size: 25px;
      font-weight: 900;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .score-follow-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .score-follow-meta-left {
      display: grid;
      gap: 2px;
      color: #473124;
      font-size: 17px;
      font-weight: 800;
    }

    .score-follow-meta-right {
      color: var(--wood);
      font-size: 16px;
      font-weight: 800;
      text-align: right;
    }

    .score-follow-prefix {
      flex: 0 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 98px;
      color: #3b2418;
      font-size: 24px;
      font-weight: 900;
      line-height: 0.88;
      white-space: pre-line;
    }

    .score-follow-measure-row {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(var(--measure-count, 1), minmax(0, 1fr));
      gap: 10px;
      min-width: 0;
    }

    .score-follow-measure {
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--unit-count, 8), minmax(0, 1fr));
      grid-template-rows: 22px 22px 14px auto 16px;
      gap: 4px 6px;
      align-items: start;
      width: 100%;
      min-width: 0;
      padding: 12px 8px 0 0;
      border-right: 2px solid rgba(125, 75, 43, 0.18);
    }

    .score-follow-measure:last-child {
      padding-right: 0;
      border-right: 0;
    }

    .score-follow-bow {
      grid-row: 1;
      align-self: end;
      justify-self: center;
      color: #2e1f17;
      font-size: 15px;
      font-weight: 900;
      line-height: 1;
      white-space: pre;
      pointer-events: none;
      padding: 0 1px;
      transform: translateY(-1px);
    }

    .score-follow-guide {
      grid-row: 2;
      align-self: end;
      justify-self: center;
      color: #2e1f17;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 0.01em;
      white-space: pre;
      pointer-events: none;
      padding: 0 1px;
      transform: translateY(1px);
    }

    .score-follow-slur {
      grid-row: 3;
      height: 12px;
      border: 1.5px solid rgba(125, 75, 43, 0.62);
      border-bottom: 0;
      border-radius: 16px 16px 0 0;
      margin: 2px 1px 0;
      pointer-events: none;
    }

    .score-follow-underline {
      grid-row: 5;
      align-self: start;
      border-top: 1.5px solid #2f2118;
      margin: 0 1px;
      pointer-events: none;
    }

    .score-follow-underline.double {
      box-shadow: 0 3.5px 0 0 #2f2118;
    }

    .score-follow-marker {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      padding: 0 4px;
      background: rgba(255, 255, 255, 0.94);
      color: var(--wood);
      font-size: 10px;
      font-weight: 900;
      line-height: 1.2;
    }

    .score-follow-label {
      flex: 0 0 64px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(125, 75, 43, 0.08);
      color: var(--wood);
      font-size: 13px;
      font-weight: 900;
    }

    .score-follow-notes {
      flex: 1;
      display: flex;
      gap: 8px;
      min-width: 0;
    }

    .score-follow-cell {
      flex: var(--beats, 1) 1 0;
      display: inline-flex;
      align-items: flex-end;
      justify-content: center;
      min-width: 0;
      padding: 0;
    }

    .score-follow-measure .score-follow-cell {
      grid-row: 4;
      min-width: 0;
      position: relative;
      padding-top: 3px;
    }

    .score-follow-main {
      display: inline-flex;
      align-items: flex-start;
      justify-content: center;
      color: #382217;
      font-size: 19px;
      font-weight: 900;
      line-height: 1;
      padding-top: 2px;
    }

    .score-follow-jianpu {
      display: inline-grid;
      justify-items: center;
      min-width: 18px;
      line-height: 1;
    }

    .score-follow-octave {
      min-height: 10px;
      color: #20140e;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 0.85;
    }

    .score-follow-digit {
      margin-top: 1px;
      color: #382217;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
    }

    .score-follow-low-octave {
      min-height: 8px;
      color: #20140e;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 0.7;
    }

    .score-follow-low-octave-marker {
      grid-row: 5;
      justify-self: center;
      align-self: start;
      color: #20140e;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 0.7;
      pointer-events: none;
      transform: translateY(4px);
    }

    .score-follow-tail {
      margin-left: 1px;
      align-self: flex-end;
      color: #382217;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
    }

    .score-follow-rhythm-dot {
      margin-left: 2px;
      align-self: flex-end;
      color: #25170f;
      font-size: 28px;
      font-weight: 950;
      line-height: 0.8;
      transform: translateY(-3px);
    }

    .score-follow-upper-note {
      position: absolute;
      top: -4px;
      left: 12%;
      color: #382217;
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }

    .score-follow-plain {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--wood);
      font-size: 18px;
      line-height: 1.8;
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    .score-note {
      margin-top: 12px;
      font-size: 14px;
    }

    .score-empty {
      margin-top: 12px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(125, 75, 43, 0.06);
      color: var(--muted);
      line-height: 1.8;
    }

    .song-links {
      margin-top: 16px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255, 248, 238, 0.86);
      border: 1px solid rgba(125, 75, 43, 0.08);
    }

    .song-links h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .song-link-list {
      display: grid;
      gap: 10px;
    }

    .song-link-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(125, 75, 43, 0.08);
    }

    .song-link-item strong {
      color: var(--ink);
    }

    .song-link-item small {
      color: var(--wood);
      font-weight: 800;
    }

    .practice-detail[hidden],
    .song-links[hidden],
    .actions[hidden] {
      display: none;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 144px;
      padding: 12px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffd66b, #e7861d);
      color: #4a2f18;
      font-weight: 900;
    }

    .button.secondary {
      background: rgba(125, 75, 43, 0.08);
      color: var(--wood);
    }

  </style>

    function parseScoreNotation(scoreText) {
      const rows = [];
      String(scoreText || "").split(/\n+/).forEach(function (lineText, rowIndex) {
        const line = lineText.trim();
        if (!line) return;
        const tokens = line.replace(/\|/g, " | ").trim().split(/\s+/);
        const row = [];
        let current = null;
        tokens.forEach(function (token) {
          if (!token || token === "|") return;
          const parts = token.match(/([1-7]'+|[1-7]|-+|~+)/g) || [];
          parts.forEach(function (part) {
            if (/^[1-7]/.test(part)) {
              current = {
                rowIndex: rowIndex,
                label: part,
                beats: 1
              };
              row.push(current);
            } else if (/^[-~]+$/.test(part) && current) {
              current.beats += part.length;
            }
          });
        });
        if (row.length) {
          rows.push(row);
        }
      });
      return rows;
    }

    function buildScoreDisplayLabel(cellData) {
      if (!cellData || cellData.beats <= 1) {
        return cellData ? cellData.label : "";
      }
      return cellData.label + "-".repeat(cellData.beats - 1);
    }

    function buildJianpuHtml(label) {
      const raw = String(label || "");
      const noteMatch = raw.match(/^([1-7])('+)?(,*)?(\.)?(.*)$/);
      if (!noteMatch) {
        return raw;
      }
      const digit = noteMatch[1];
      const highDots = (noteMatch[2] || "").length;
      const lowDots = (noteMatch[3] || "").length;
      const rhythmDot = noteMatch[4] || "";
      const tail = noteMatch[5] || "";
      return (
        "<span class=\"score-follow-jianpu\">" +
          "<span class=\"score-follow-octave\">" + (highDots ? "●".repeat(highDots) : "") + "</span>" +
          "<span class=\"score-follow-digit\">" + digit + "</span>" +
        "</span>" +
        (rhythmDot ? "<span class=\"score-follow-rhythm-dot\">.</span>" : "") +
        (tail ? "<span class=\"score-follow-tail\">" + tail + "</span>" : "")
      );
    }

    function lowOctaveText(label) {
      const matched = String(label || "").match(/^[1-7](?:'+)?(,*)/);
      const count = matched ? (matched[1] || "").length : 0;
      return count ? "●".repeat(count) : "";
    }

    function normalizeScoreCell(cellData) {
      if (typeof cellData === "string") {
        return { label: cellData, beats: 1, units: 1 };
      }
      return {
        label: cellData.label || "",
        beats: Number(cellData.beats) > 0 ? Number(cellData.beats) : 1,
        units: Number(cellData.units) > 0 ? Number(cellData.units) : 1,
        sub: cellData.sub || ""
      };
    }

    function normalizeTextSpan(spanData) {
      if (Array.isArray(spanData)) {
        return {
          start: Number(spanData[0]) || 0,
          end: Number(spanData[1]) || Number(spanData[0]) || 0,
          text: String(spanData[2] || "")
        };
      }
      return {
        start: Number(spanData && spanData.start) || 0,
        end: Number(spanData && spanData.end) || Number(spanData && spanData.start) || 0,
        text: String((spanData && spanData.text) || "")
      };
    }

    function renderTextSpans(measure, cells, cellStarts, spans, className) {
      (spans || []).forEach(function (spanData) {
        const spanMeta = normalizeTextSpan(spanData);
        if (!spanMeta.text) {
          return;
        }
        const tokens = spanMeta.text.trim().split(/\s+/).filter(Boolean);
        const start = Math.max(0, Math.min(cells.length - 1, spanMeta.start));
        const end = Math.max(start, Math.min(cells.length - 1, spanMeta.end));
        if (tokens.length > 1) {
          tokens.forEach(function (token, tokenIndex) {
            const target = Math.min(end, start + tokenIndex);
            const mark = document.createElement("div");
            mark.className = className;
            mark.style.gridColumn = (cellStarts[target] + 1) + " / " + (cellStarts[target] + cells[target].units + 1);
            mark.textContent = token;
            measure.appendChild(mark);
          });
          return;
        }
        const mark = document.createElement("div");
        mark.className = className;
        mark.style.gridColumn = (cellStarts[start] + 1) + " / " + (cellStarts[end] + cells[end].units + 1);
        mark.textContent = spanMeta.text;
        measure.appendChild(mark);
      });
    }

    function buildCellTextMap(cells, spans) {
      const textMap = {};
      (spans || []).forEach(function (spanData) {
        const spanMeta = normalizeTextSpan(spanData);
        if (!spanMeta.text) {
          return;
        }
        const start = Math.max(0, Math.min(cells.length - 1, spanMeta.start));
        const end = Math.max(start, Math.min(cells.length - 1, spanMeta.end));
        const tokens = spanMeta.text.trim().split(/\s+/).filter(Boolean);
        if (tokens.length === end - start + 1) {
          tokens.forEach(function (token, offset) {
            textMap[start + offset] = token;
          });
          return;
        }
        textMap[start] = spanMeta.text;
      });
      return textMap;
    }

    function buildAutoUnderlines(cells, beatUnits, totalUnits) {
      const ranges = [];
      const starts = [];
      const singleCovered = new Array(cells.length).fill(false);
      const doubleCovered = new Array(cells.length).fill(false);
      let cursor = 0;
      cells.forEach(function (cellData) {
        starts.push(cursor);
        cursor += cellData.units;
      });
      const measureUnits = Math.max(totalUnits || 0, cursor);
      const beatSize = Math.max(1, Number(beatUnits) || 4);
      for (let beatStart = 0; beatStart < measureUnits; beatStart += beatSize) {
        const beatEnd = beatStart + beatSize;
        const single = [];
        const double = [];
        cells.forEach(function (cellData, cellIndex) {
          const start = starts[cellIndex];
          const end = start + cellData.units;
          if (start >= beatStart && end <= beatEnd && cellData.units < beatSize) {
            single.push(cellIndex);
          }
          if (start >= beatStart && end <= beatEnd && cellData.units < beatSize / 2) {
            double.push(cellIndex);
          }
        });
        if (single.length) {
          ranges.push([single[0], single[single.length - 1], 1]);
          for (let singleIndex = single[0]; singleIndex <= single[single.length - 1]; singleIndex += 1) {
            singleCovered[singleIndex] = true;
          }
        }
        if (double.length) {
          let groupStart = double[0];
          let previous = double[0];
          for (let index = 1; index <= double.length; index += 1) {
            const current = double[index];
            if (current === previous + 1) {
              previous = current;
              continue;
            }
            ranges.push([groupStart, previous, 2]);
            for (let doubleIndex = groupStart; doubleIndex <= previous; doubleIndex += 1) {
              doubleCovered[doubleIndex] = true;
              singleCovered[doubleIndex] = true;
            }
            groupStart = current;
            previous = current;
          }
        }
      }
      cells.forEach(function (cellData, cellIndex) {
        if (cellData.units < beatSize / 2 && !doubleCovered[cellIndex]) {
          ranges.push([cellIndex, cellIndex, 2]);
          doubleCovered[cellIndex] = true;
          singleCovered[cellIndex] = true;
        }
        if (cellData.units < beatSize && !singleCovered[cellIndex]) {
          ranges.push([cellIndex, cellIndex, 1]);
          singleCovered[cellIndex] = true;
        }
      });
      return ranges;
    }

    function renderStructuredScore(scoreText, rows, scoreData) {
      scoreText.className = "score-follow-sheet";
      rows.forEach(function (rowData, rowIndex) {
        const rowWrap = document.createElement("div");
        rowWrap.className = "score-follow-row";

        if (rowData.label) {
          const rowLabel = document.createElement("div");
          rowLabel.className = "score-follow-label";
          rowLabel.textContent = rowData.label;
          rowWrap.appendChild(rowLabel);
        }

        if (rowData.prefix) {
          const prefix = document.createElement("div");
          prefix.className = "score-follow-prefix";
          prefix.textContent = rowData.prefix;
          rowWrap.appendChild(prefix);
        }

        const measureRow = document.createElement("div");
        measureRow.className = "score-follow-measure-row";
        measureRow.style.setProperty("--measure-count", String((rowData.measures || []).length || 1));

        (rowData.measures || []).forEach(function (measureData) {
          const cells = (measureData.cells || []).map(normalizeScoreCell);
          if (!cells.length) {
            return;
          }
          const cellStarts = [];
          let unitCursor = 0;
          cells.forEach(function (cellData) {
            cellStarts.push(unitCursor);
            unitCursor += cellData.units;
          });
          const unitCount = Math.max(Number(measureData.totalUnits) || 0, unitCursor, 8);
          const measure = document.createElement("div");
          measure.className = "score-follow-measure";
          measure.style.setProperty("--unit-count", String(unitCount));
          if (measureData.marker) {
            const marker = document.createElement("div");
            marker.className = "score-follow-marker";
            marker.textContent = measureData.marker;
            measure.appendChild(marker);
          }

          renderTextSpans(measure, cells, cellStarts, measureData.bows || [], "score-follow-bow");
          renderTextSpans(measure, cells, cellStarts, measureData.fingerings || measureData.guides || [], "score-follow-guide");
          const upperNoteMap = buildCellTextMap(cells, measureData.upperNotes || []);

          (measureData.slurs || []).forEach(function (slurRange) {
            const start = Math.max(0, Number(slurRange[0]) || 0);
            const end = Math.min(cells.length - 1, Number(slurRange[1]) || 0);
            if (end < start) {
              return;
            }
            const startUnit = cellStarts[start];
            const endUnit = cellStarts[end] + cells[end].units;
            const slur = document.createElement("div");
            slur.className = "score-follow-slur";
            slur.style.gridColumn = (startUnit + 1) + " / " + (endUnit + 1);
            measure.appendChild(slur);
          });

          cells.forEach(function (cellData, cellIndex) {
            const startUnit = cellStarts[cellIndex];
            const endUnit = startUnit + cellData.units;
            const cell = document.createElement("div");
            cell.className = "score-follow-cell";
            cell.style.gridColumn = (startUnit + 1) + " / " + (endUnit + 1);
            const upperNote = upperNoteMap[cellIndex] ? ("<span class=\"score-follow-upper-note\">" + upperNoteMap[cellIndex] + "</span>") : "";
            cell.innerHTML = upperNote + "<span class=\"score-follow-main\">" + buildJianpuHtml(cellData.label) + "</span>";
            measure.appendChild(cell);
            const lowDots = lowOctaveText(cellData.label);
            if (lowDots) {
              const lowMarker = document.createElement("div");
              lowMarker.className = "score-follow-low-octave-marker";
              lowMarker.style.gridColumn = (startUnit + 1) + " / " + (endUnit + 1);
              lowMarker.textContent = lowDots;
              measure.appendChild(lowMarker);
            }
          });

          const underlineRanges = scoreData && scoreData.autoUnderlines
            ? buildAutoUnderlines(cells, scoreData.beatUnits || 4, unitCount)
            : (measureData.underlines || []);
          underlineRanges.forEach(function (underlineRange) {
            const start = Math.max(0, Number(underlineRange[0]) || 0);
            const end = Math.min(cells.length - 1, Number(underlineRange[1]) || 0);
            if (end < start) {
              return;
            }
            const startUnit = cellStarts[start];
            const endUnit = cellStarts[end] + cells[end].units;
            const underline = document.createElement("div");
            underline.className = "score-follow-underline" + ((Number(underlineRange[2]) || 1) >= 2 ? " double" : " single");
            underline.style.gridColumn = (startUnit + 1) + " / " + (endUnit + 1);
            measure.appendChild(underline);
          });

          measureRow.appendChild(measure);
        });

        rowWrap.appendChild(measureRow);
        scoreText.appendChild(rowWrap);
      });
    }

    function renderPieceScore(scoreData) {
      const scoreText = document.getElementById("scoreText");
      scoreText.innerHTML = "";
      if (!scoreData) {
        return;
      }
      if (Array.isArray(scoreData.rows) && scoreData.rows.length) {
        if (scoreData.header) {
          const header = document.createElement("div");
          header.className = "score-follow-header";
          header.innerHTML =
            "<div class=\"score-follow-title\">" + (scoreData.header.number ? scoreData.header.number + " " : "") + (scoreData.header.title || "") + "</div>" +
            "<div class=\"score-follow-meta\">" +
              "<div class=\"score-follow-meta-left\">" +
                (Array.isArray(scoreData.header.left) ? scoreData.header.left.map(function (item) {
                  return "<div>" + item + "</div>";
                }).join("") : "") +
              "</div>" +
              "<div class=\"score-follow-meta-right\">" + (scoreData.header.right || "") + "</div>" +
            "</div>";
          scoreText.appendChild(header);
        }
        renderStructuredScore(scoreText, scoreData.rows, scoreData);
        return;
      }
      if (!scoreData.notation) {
        return;
      }
      const rows = parseScoreNotation(scoreData.notation);
      if (!rows.length) {
        scoreText.className = "score-follow-plain";
        scoreText.textContent = scoreData.notation;
        return;
      }
      scoreText.className = "score-follow-sheet";
      rows.forEach(function (row) {
        const rowWrap = document.createElement("div");
        rowWrap.className = "score-follow-row";

        const rowNotes = document.createElement("div");
        rowNotes.className = "score-follow-notes";
        row.forEach(function (cellData) {
          const cell = document.createElement("div");
          cell.className = "score-follow-cell";
          cell.style.setProperty("--beats", String(cellData.beats));
          cell.innerHTML = "<span class=\"score-follow-main\">" + buildJianpuHtml(buildScoreDisplayLabel(cellData)) + "</span>";
          rowNotes.appendChild(cell);
        });
        rowWrap.appendChild(rowNotes);
        scoreText.appendChild(rowWrap);
      });
    }

    function extractTonicFromScoreData(scoreData) {
      const sources = [];
      if (scoreData && scoreData.header && Array.isArray(scoreData.header.left)) {
        sources.push(scoreData.header.left.join(" "));
      }
      if (scoreData && scoreData.note) {
        sources.push(scoreData.note);
      }
      for (let index = 0; index < sources.length; index += 1) {
        const matched = String(sources[index] || "").match(/1\s*=\s*([A-G](?:b|#)?)/i);
        if (matched) {
          return matched[1];
        }
      }
      return "D";
    }

    const defaultPiece = data.pieces.find(function (piece) { return piece.type !== "本級主題"; }) || data.pieces[0];
    const pieceId = params.get("piece") || defaultPiece.id;
    const selectedPiece = data.pieces.find(function (piece) { return piece.id === pieceId; }) || data.pieces[0];

    document.title = "二胡小教室 | " + course.label + data.grade + "級數課程";
    document.getElementById("backLevelLink").href = course.backLink;
    document.getElementById("backLevelLink").textContent = "回" + course.label + "檢定";
    document.getElementById("weekLabel").textContent = course.label + "檢定｜" + data.grade;
    document.getElementById("weekTitle").textContent = data.title;
    document.getElementById("weekDescription").textContent = data.description;
    document.getElementById("pieceMeta").textContent = data.note;
    document.getElementById("pieceTypeChip").textContent = selectedPiece.type;
    document.getElementById("pieceTitle").textContent = cleanPieceName(selectedPiece.title);
    document.getElementById("pieceDescription").textContent = selectedPiece.description;
    const videoFrame = document.getElementById("videoFrame");
    const videoFrameWrap = videoFrame.parentElement;
    const videoEmpty = document.getElementById("videoEmpty");
    if (selectedPiece.videoAvailable) {
      videoFrameWrap.hidden = false;
      videoEmpty.hidden = true;
      videoFrame.src = selectedPiece.videoEmbed;
    } else {
      videoFrameWrap.hidden = true;
      videoFrame.src = "";
      videoEmpty.hidden = false;
      videoEmpty.textContent = "這首曲子找不到黃國豪的對應示範素材，所以這裡不提供站內播放。你如果想看別的版本，可以用下方的「其他示範教材」按鈕。";
    }
    document.getElementById("videoNote").textContent = selectedPiece.videoNote;
    const videoHelp = document.getElementById("videoHelp");
    if (!/^https?:$/.test(window.location.protocol)) {
      videoHelp.hidden = false;
      videoHelp.textContent = "這個播放器要在瀏覽器用 localhost 網址開，YouTube 才會接受來源並直接播放。";
    }
    document.getElementById("scoreNote").textContent = selectedPiece.scoreNote;
    document.getElementById("videoSearchLink").href = selectedPiece.videoSearchUrl;
    document.getElementById("videoSearchLink").textContent = "其他示範教材";
    const aiPitchLink = document.getElementById("aiPitchLink");
    aiPitchLink.href = buildAiPitchUrl(selectedPiece);
    const scoreEditLink = document.getElementById("scoreEditLink");
    scoreEditLink.href = buildScoreEditorUrl(selectedPiece);
    document.getElementById("aiScoreLink").href = buildAiTutorUrl(selectedPiece.title, true);

    const scoreEmpty = document.getElementById("scoreEmpty");
    const scoreBox = document.getElementById("scoreBox");
    const scoreActions = document.getElementById("scoreActions");
    const songLinksSection = document.getElementById("songLinksSection");
    const practiceDetailPanel = document.getElementById("practiceDetailPanel");
    if (selectedPiece.scoreAvailable) {
      scoreEmpty.hidden = true;
      scoreBox.hidden = false;
      document.querySelector(".score-title").hidden = true;
      document.getElementById("scoreIntro").hidden = true;
      document.getElementById("scoreNote").hidden = true;
      renderPieceScore(selectedPiece.scoreData);
      document.getElementById("pieceDescription").hidden = true;
      document.getElementById("videoNote").hidden = true;
      scoreActions.hidden = false;
      aiPitchLink.hidden = false;
      scoreEditLink.hidden = false;
      songLinksSection.hidden = true;
      practiceDetailPanel.hidden = false;
    } else {
      scoreEmpty.hidden = false;
      scoreBox.hidden = true;
      document.querySelector(".score-title").hidden = false;
      document.getElementById("scoreIntro").hidden = false;
      document.getElementById("scoreNote").hidden = false;
      document.getElementById("pieceDescription").hidden = false;
      document.getElementById("videoNote").hidden = false;
      scoreActions.hidden = false;
      aiPitchLink.hidden = true;
      scoreEditLink.hidden = true;
      songLinksSection.hidden = false;
      practiceDetailPanel.hidden = false;
      document.getElementById("scoreIntro").textContent = "這裡不提供站內簡譜，會直接引導你用 AI 助教要譜，再搭配示範教材和本級重點練習。";
      scoreEmpty.textContent = "這首曲子目前沒有站內簡譜。你可以看左邊示範教材，再用下方按鈕查看其他示範教材，或直接問 AI 助教要《" + cleanPieceName(selectedPiece.title) + "》的二胡簡譜。";
    }

    const pieceTabs = document.getElementById("pieceTabs");
    const songLinkList = document.getElementById("songLinkList");
    data.pieces.forEach(function (piece) {
      const tab = document.createElement("a");
      tab.className = "piece-tab" + (piece.id === selectedPiece.id ? " active" : "");
      tab.href = window.ErhuExamProgress.buildUrl("./二胡小教室-週課程.html", {
        level: level,
        grade: week,
        piece: piece.id
      });
      tab.textContent = piece.type + "｜" + cleanPieceName(piece.title);
      pieceTabs.appendChild(tab);

      const row = document.createElement("div");
      row.className = "song-link-item";
      row.innerHTML =
        "<div><small>" + piece.type + "</small><strong>" + cleanPieceName(piece.title) + "</strong></div>" +
        "<a class=\"button secondary\" href=\"" + window.ErhuExamProgress.buildUrl("./二胡小教室-週課程.html", { level: level, grade: week, piece: piece.id }) + "\">打開練習</a>";
      songLinkList.appendChild(row);
    });

    const focusList = document.getElementById("focusList");
    const taskList = document.getElementById("taskList");
    data.focus.forEach((item) => {
      const li = document.createElement("li");
      li.textContent = item;
      focusList.appendChild(li);
    });
    data.tasks.forEach((item) => {
      const li = document.createElement("li");
      li.textContent = item;
      taskList.appendChild(li);
    });

    const prevGrade = ErhuQuality.gradeNeighbor(level, week, -1);
    const nextGrade = ErhuQuality.gradeNeighbor(level, week, 1);
    const prevLink = document.getElementById("prevWeekLink");
    const nextLink = document.getElementById("nextWeekLink");
    document.getElementById("quizLink").href = window.ErhuExamProgress.buildUrl("./二胡小教室-小測驗.html", { level: level, grade: week });
    document.getElementById("plannerLink").href = window.ErhuExamProgress.buildUrl("./二胡小教室-AI練習規劃師.html", { level: level, grade: week });
    document.getElementById("plannerLinkTop").href = window.ErhuExamProgress.buildUrl("./二胡小教室-AI練習規劃師.html", { level: level, grade: week });
    document.getElementById("aiLink").href = buildAiTutorUrl(selectedPiece.title, false);
    for (const [link, target, boundary] of [[prevLink, prevGrade, "已是第一級"], [nextLink, nextGrade, "已是第十級"]]) {
      if (target) link.href = window.ErhuExamProgress.buildUrl("./二胡小教室-週課程.html", target);
      else { link.removeAttribute("href"); link.setAttribute("aria-disabled", "true"); link.textContent = boundary; }
    }
    if (!selectedPiece.scoreAvailable) {
      aiPitchLink.hidden = false;
      aiPitchLink.href = "./二胡小教室-AI掃描譜.html?title=" + encodeURIComponent(cleanPieceName(selectedPiece.title));
      aiPitchLink.textContent = "上傳這首曲子的譜";
      scoreEmpty.textContent = "這首曲子尚無站內譜面。請上傳你有權使用的原譜，確認辨識結果後即可編輯與跟譜。";
    }

  </script>
</body>
</html>
