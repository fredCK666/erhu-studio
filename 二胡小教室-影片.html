  <style>
    :root {
      --ink: #211914;
      --muted: #69584d;
      --paper: rgba(255, 250, 244, 0.92);
      --line: rgba(83, 57, 39, 0.12);
      --wood: #7b4d2d;
      --shadow: 0 22px 54px rgba(46, 28, 18, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, #f7efe3 0%, #fbf9f5 40%, #efe4d5 100%);
    }

    a { color: inherit; text-decoration: none; }

    .shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .hero,
    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 28px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 46px);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    h3 {
      margin: 16px 0 10px;
      font-size: 18px;
    }

    p,
    li {
      color: var(--muted);
      line-height: 1.8;
    }

    .tabs {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .tab {
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fffdf8;
      color: var(--wood);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .tab.active {
      background: linear-gradient(135deg, #efc06f, #ca8531);
      color: #4d2f15;
      border-color: transparent;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
      gap: 18px;
    }

    .video-player {
      overflow: hidden;
      border-radius: 20px;
      background: #18120f;
      aspect-ratio: 16 / 9;
      margin-bottom: 16px;
    }

    .video-player iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .playlist {
      display: grid;
      gap: 12px;
    }

    .playlist-item {
      padding: 18px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: #fffdf8;
      cursor: pointer;
      text-align: left;
    }

    .playlist-item.active {
      border-color: rgba(123, 77, 45, 0.5);
      background: #fffcf6;
    }

    .playlist-item small {
      display: block;
      margin-bottom: 8px;
      color: var(--wood);
      font-weight: 800;
      font-size: 14px;
    }

    .playlist-item strong {
      display: block;
      margin-bottom: 6px;
      font-size: 22px;
      line-height: 1.35;
    }

    .playlist-item div {
      font-size: 16px;
      line-height: 1.7;
      color: var(--muted);
    }

    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .pill {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(123, 77, 45, 0.1);
      color: var(--wood);
      font-size: 13px;
      font-weight: 800;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, #efc06f, #ca8531);
      color: #4d2f15;
      font-weight: 800;
    }

    .button.secondary {
      background: rgba(123, 77, 45, 0.1);
      color: var(--wood);
    }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
<link rel="stylesheet" href="./erhu-refined.css?v=20260928" />
<script src="./erhu-quality.js?v=20260928"></script>
</head>
<body class="erhu-site">
  <main class="shell">
    <header class="topbar">
      <div class="brand">二胡小教室</div>
      <nav class="nav">
        <a href="./">回首頁</a>
        <a href="./二胡小教室.html#course-levels">課程分級</a>
        <a href="./二胡小教室-章節.html">級數總覽</a>
        <a href="./二胡小教室-練習打卡.html">檢定打卡</a>
      </nav>
      <a class="tuner-shortcut" href="./二胡小教室-調音器.html">調音器</a>
    </header>
    <section class="hero">
      <h1>檢定示範教材</h1>
      <p>這一頁整理各級檢定對應的外部示範素材。切換等級後，可以直接選某一級進播放器，再跳去該級課程或查找其他示範版本。</p>
      <div class="tabs" id="levelTabs"></div>
    </section>
    <section class="panel" style="padding:24px;">
      <div class="layout">
        <div>
          <div class="video-player">
            <iframe id="videoFrame" src="" title="二胡檢定示範教材播放器" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="origin" allowfullscreen></iframe>
          </div>
          <div class="meta">
            <span class="pill" id="currentLevel"></span>
            <span class="pill" id="currentGrade"></span>
          </div>
          <h2 id="videoTitle"></h2>
          <p id="videoDescription"></p>
          <h3>指定曲</h3>
          <p id="specifiedPiece"></p>
          <h3>自選曲</h3>
          <p id="selectedPieces"></p>
          <div class="actions">
            <a class="button" id="openCourseLink" href="#">打開這一級課程</a>
            <a class="button secondary" id="otherVideosLink" href="#" target="_blank" rel="noopener noreferrer">其他示範教材</a>
          </div>
        </div>
        <div class="playlist" id="videoPlaylist"></div>
      </div>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./firebase-init.js?v=20260928"></script>
  <script src="./auth.js?v=20260928"></script>
  <script src="./exam-course-data.js?v=20260505c"></script>
  <script src="./exam-progress.js?v=20260519a"></script>
  <script>
    window.ErhuAuth.requireAuth();
    window.ErhuAuth.attachAuthUI();

    var levels = window.ErhuExamData.levels;
    var params = new URLSearchParams(window.location.search);
    var currentLevel = levels[params.get("level")] ? params.get("level") : "beginner";
    var currentGrade = 1;
    var levelTabs = document.getElementById("levelTabs");
    var videoPlaylist = document.getElementById("videoPlaylist");
    var videoFrame = document.getElementById("videoFrame");

    function embedUrl(videoId) {
      return "https://www.youtube.com/embed/" + videoId + "?rel=0";
    }

    function otherVideosUrl(item) {
      var query = "黃國豪 " + (item.specified === "本級無指定曲" ? item.selected[0] : item.specified) + " 二胡";
      return "https://www.youtube.com/results?search_query=" + encodeURIComponent(query);
    }

    function gradeData(levelKey, gradeIndex) {
      return levels[levelKey].grades[gradeIndex - 1];
    }

    function setActiveGrade(levelKey, gradeIndex) {
      currentLevel = levelKey;
      currentGrade = gradeIndex;
      var item = gradeData(levelKey, gradeIndex);
      if (!item) {
        return;
      }

      document.querySelectorAll(".tab").forEach(function (button) {
        button.classList.toggle("active", button.dataset.level === levelKey);
      });
      document.querySelectorAll(".playlist-item").forEach(function (button) {
        button.classList.toggle("active", button.dataset.gradeIndex === String(gradeIndex));
      });

      document.title = "二胡小教室 | " + levels[levelKey].label + item.grade + "示範教材";
      videoFrame.src = embedUrl(item.video);
      document.getElementById("currentLevel").textContent = levels[levelKey].label + "檢定";
      document.getElementById("currentGrade").textContent = item.grade;
      document.getElementById("videoTitle").textContent = item.grade + "｜" + item.shortTitle;
      document.getElementById("videoDescription").textContent = item.description;
      document.getElementById("specifiedPiece").textContent = item.specified;
      document.getElementById("selectedPieces").textContent = item.selected.join("、");
      document.getElementById("openCourseLink").href = window.ErhuExamProgress.buildUrl("./二胡小教室-週課程.html", {
        level: levelKey,
        grade: gradeIndex
      });
      document.getElementById("otherVideosLink").href = otherVideosUrl(item);
      history.replaceState(null, "", window.ErhuExamProgress.buildUrl("./二胡小教室-影片.html", {
        level: levelKey,
        grade: gradeIndex
      }));
    }

    function renderPlaylist(levelKey) {
      videoPlaylist.innerHTML = "";
      levels[levelKey].grades.forEach(function (item, index) {
        var gradeIndex = index + 1;
        var button = document.createElement("button");
        button.type = "button";
        button.className = "playlist-item";
        button.dataset.gradeIndex = String(gradeIndex);
        button.innerHTML =
          "<small>" + item.grade + "</small>" +
          "<strong>" + item.shortTitle + "</strong>" +
          "<div>指定曲：" + item.specified + "<br>自選曲：" + item.selected.join("、") + "</div>";
        button.addEventListener("click", function () {
          setActiveGrade(levelKey, gradeIndex);
        });
        videoPlaylist.appendChild(button);
      });
    }

    function renderLevelTabs() {
      levelTabs.innerHTML = "";
      Object.keys(levels).forEach(function (levelKey) {
        var button = document.createElement("button");
        button.type = "button";
        button.className = "tab";
        button.dataset.level = levelKey;
        button.textContent = levels[levelKey].label;
        button.addEventListener("click", function () {
          renderPlaylist(levelKey);
          setActiveGrade(levelKey, 1);
        });
        levelTabs.appendChild(button);
      });
    }

    renderLevelTabs();
    renderPlaylist(currentLevel);
    setActiveGrade(
      currentLevel,
      Math.min(levels[currentLevel].grades.length, window.ErhuExamProgress.getGradeNumber(params, 1))
    );
  </script>
</body>
