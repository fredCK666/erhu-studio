<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>二胡小教室 | 學習測驗</title>
  <meta name="description" content="二胡學習測驗依檢定級別出題，保存最近分數、最佳分數與弱項級數，讓 AI 規劃可依紀錄安排練習。" />
  <link rel="canonical" href="https://erhu-auth.web.app/二胡小教室-小測驗.html" />
  <link rel="manifest" href="./site.webmanifest" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_TW" />
  <meta property="og:title" content="二胡小教室 | 學習測驗" />
  <meta property="og:description" content="用測驗找出二胡檢定級數弱點，並接到 AI 練習規劃與回報。" />
  <meta property="og:url" content="https://erhu-auth.web.app/二胡小教室-小測驗.html" />
  <meta property="og:image" content="https://erhu-auth.web.app/assets/scores/level1-lian-gong-yu-fu-dian.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="./erhu-theme.css?v=20260327f" />
  <style>
    :root { --ink:#211914; --muted:#69584d; --paper:rgba(255,250,244,0.92); --line:rgba(83,57,39,0.12); --wood:#7b4d2d; --shadow:0 22px 54px rgba(46,28,18,0.14); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; background:linear-gradient(180deg,#f7efe3 0%,#fbf9f5 40%,#efe4d5 100%); }
    a { color:inherit; text-decoration:none; }
    .shell { width:min(1120px,calc(100% - 28px)); margin:0 auto; padding:24px 0 40px; }
    .hero,.panel { background:var(--paper); border:1px solid var(--line); border-radius:28px; box-shadow:var(--shadow); }
    .hero { padding:28px; margin-bottom:18px; }
    h1 { margin:0 0 10px; font-size:clamp(30px,5vw,46px); }
    .hero p,.panel p { color:var(--muted); line-height:1.8; }
    .tabs,.week-tabs { display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; }
    .tab,.week-tab { padding:12px 18px; border-radius:999px; border:1px solid var(--line); background:#fffdf8; color:var(--wood); font-size:18px; font-weight:800; cursor:pointer; }
    .week-tab { font-size:16px; padding:10px 14px; }
    .tab.active,.week-tab.active { background:linear-gradient(135deg,#efc06f,#ca8531); color:#4d2f15; border-color:transparent; }
    .quiz-grid { display:grid; gap:14px; }
    .question { padding:18px; border-radius:20px; border:1px solid var(--line); background:#fffdf8; }
    .question.correct { border-color:rgba(105,161,84,0.5); background:rgba(240,251,235,0.92); }
    .question.incorrect { border-color:rgba(204,107,77,0.4); background:rgba(255,244,240,0.96); }
    .options { display:grid; gap:10px; margin-top:12px; }
    .option { display:flex; gap:10px; align-items:start; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,0.78); }
    .meta { margin:18px 0 22px; padding:16px 18px; border-radius:18px; background:rgba(123,77,45,0.08); color:var(--muted); }
    .score-history { margin:0 0 18px; padding:14px 16px; border-radius:18px; background:rgba(123,77,45,0.08); color:var(--wood); font-weight:800; }
    .feedback { margin-top:12px; font-weight:800; }
    .feedback.correct { color:#4f7d35; }
    .feedback.incorrect { color:#ba5d3c; }
    .controls { display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; }
    .button { display:inline-flex; align-items:center; justify-content:center; padding:12px 16px; border:0; border-radius:999px; background:linear-gradient(135deg,#efc06f,#ca8531); color:#4d2f15; font-weight:800; cursor:pointer; }
    .button.secondary { background:rgba(123,77,45,0.1); color:var(--wood); }
    .result { margin-top:14px; color:var(--wood); font-weight:800; }
  </style>
<link rel="stylesheet" href="./erhu-refined.css?v=20260928" />
<script src="./erhu-quality.js?v=20260928"></script>
<link rel="stylesheet" href="./erhu-studio-ui.css?v=20260929-polish"><script defer src="./erhu-studio-ui.js?v=20260929-polish"></script></head>
<body class="erhu-site">
  <main class="shell">
    <header class="topbar">
      <div class="brand">二胡小教室</div>
      <nav class="nav">
        <a href="./">回首頁</a>
        <a href="./二胡小教室.html#course-levels">課程分級</a>
        <a href="./二胡小教室-AI練習規劃師.html">AI 規劃</a>
        <a href="./二胡小教室-練習打卡.html">檢定打卡</a>
      </nav>
      <a class="tuner-shortcut" href="./二胡小教室-調音器.html">調音器</a>
    </header>
    <section class="hero">
      <h1 id="pageTitle">學習測驗</h1>
      <p id="quizIntro">每個等級的每一級都有獨立 10 題，學生練完本級內容後，可以直接做本級測驗確認自己有沒有吸收。</p>
      <div class="tabs" id="levelTabs"></div>
      <div class="week-tabs" id="weekTabs"></div>
    </section>
    <section class="panel" style="padding:24px;">
      <div class="meta" id="quizMeta"></div>
      <div class="score-history" id="scoreHistory">尚未留下測驗紀錄</div>
      <div class="quiz-grid" id="quizContainer"></div>
      <div class="controls">
        <button class="button" id="submitQuizButton" type="button">送出測驗</button>
        <button class="button secondary" id="resetQuizButton" type="button">重新作答</button>
      </div>
      <div class="result" id="quizResult">尚未作答</div>
    </section>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./firebase-init.js?v=20260928"></script>
  <script src="./auth.js?v=20260928"></script>
  <script src="./exam-course-data.js?v=20260929-scm"></script>
  <script src="./exam-progress.js?v=20260519a"></script>
  <script>
    window.ErhuAuth.requireAuth();
    window.ErhuAuth.attachAuthUI();
    const weeklyData = {
      beginner: {
        label: "初級",
        weeks: window.ErhuExamData.levels.beginner.grades.map(function (item) {
          return {
            grade: item.grade,
            title: item.grade + "：" + item.shortTitle,
            shortTitle: item.shortTitle,
            specified: item.specified,
            description: item.description,
            focus: item.focus,
            tasks: item.tasks,
            note: "指定曲：" + item.specified + "｜自選曲：" + item.selected.join("、")
          };
        })
      },
      intermediate: {
        label: "中級",
        weeks: window.ErhuExamData.levels.intermediate.grades.map(function (item) {
          return {
            grade: item.grade,
            title: item.grade + "：" + item.shortTitle,
            shortTitle: item.shortTitle,
            specified: item.specified,
            description: item.description,
            focus: item.focus,
            tasks: item.tasks,
            note: "指定曲：" + item.specified + "｜自選曲：" + item.selected.join("、")
          };
        })
      },
      advanced: {
        label: "高級",
        weeks: window.ErhuExamData.levels.advanced.grades.map(function (item) {
          return {
            grade: item.grade,
            title: item.grade + "：" + item.shortTitle,
            shortTitle: item.shortTitle,
            specified: item.specified,
            description: item.description,
            focus: item.focus,
            tasks: item.tasks,
            note: "指定曲：" + item.specified + "｜自選曲：" + item.selected.join("、")
          };
        })
      }
    };

    const distractors = {
      goal: ["追求更快速度", "直接跳到下一級", "只求音量變大"],
      focus: ["完全忽略身體放鬆", "只看手不聽聲音", "遇到問題立刻停掉"],
      task: ["直接跳過練習記錄", "只做一次就結束", "不回聽也不檢查"],
      note: ["這一級重點是趕進度", "這一級只要多練時間", "這一級先不管穩定度"]
    };

    let params = new URLSearchParams(window.location.search);
    let currentLevel = params.get("level") || "beginner";
    if (!weeklyData[currentLevel]) currentLevel = "beginner";
    let currentWeek = Math.min(weeklyData[currentLevel].weeks.length, window.ErhuExamProgress.getGradeNumber(params, 1));

    const pageTitle = document.getElementById("pageTitle");
    const quizIntro = document.getElementById("quizIntro");
    const quizMeta = document.getElementById("quizMeta");
    const scoreHistory = document.getElementById("scoreHistory");
    const quizContainer = document.getElementById("quizContainer");
    const quizResult = document.getElementById("quizResult");
    const levelTabs = document.getElementById("levelTabs");
    const weekTabs = document.getElementById("weekTabs");

    function buildQuestion(id, question, correct, wrong1, wrong2, explanation) {
      return window.ErhuQuality.shuffled({ id, question, options: [correct, wrong1, wrong2], answer: 0, explanation });
    }

    function buildWeekQuiz(levelKey, weekIndex) {
      const course = weeklyData[levelKey];
      const week = course.weeks[weekIndex];
      const weekCount = course.weeks.length;
      const nextWeek = course.weeks[(weekIndex + 1) % weekCount];
      const altWeek = course.weeks[(weekIndex + 2) % weekCount];
      const otherWeekA = course.weeks[(weekIndex + 1) % weekCount];
      const otherWeekB = course.weeks[(weekIndex + 2) % weekCount];
      return [
        buildQuestion("q1", "這一級的主題是什麼？", week.shortTitle, nextWeek.shortTitle, altWeek.shortTitle, "這份測驗對應的是 " + week.title + "。"),
        buildQuestion("q2", "這一級主要在處理哪一個學習方向？", week.description, otherWeekA.description, otherWeekB.description, "先抓準這一級的主要學習方向，再進入細部練習。"),
        buildQuestion("q3", "本級教學重點之一是什麼？", week.focus[0], otherWeekA.focus[0], otherWeekB.focus[0], "本級第一個重點就是這一項。"),
        buildQuestion("q4", "本級第二個要注意的重點是什麼？", week.focus[1], otherWeekA.focus[1], otherWeekB.focus[1], "第二個教學重點要一起顧，不能只顧第一點。"),
        buildQuestion("q5", "本級第三個練習提醒是什麼？", week.focus[2], otherWeekA.focus[2], otherWeekB.focus[2], "第三個重點通常是把動作和聲音收得更完整。"),
        buildQuestion("q6", "下列哪一個是本級任務？", week.tasks[0], otherWeekA.tasks[0], otherWeekB.tasks[0], "這是本級任務安排之一。"),
        buildQuestion("q7", "學生這一級還需要完成哪一項任務？", week.tasks[1], otherWeekA.tasks[1], otherWeekB.tasks[1], "這項任務是讓學生回看自己實際狀況。"),
        buildQuestion("q8", "本級最後還要完成什麼練習？", week.tasks[2], otherWeekA.tasks[2], otherWeekB.tasks[2], "第三個任務通常是收尾與自我檢查。"),
        buildQuestion("q9", "依照這一級的曲目安排，最符合的提醒是什麼？", week.note, distractors.note[0], distractors.note[1], "這一題是在確認你有沒有記住本級指定曲和自選曲安排。"),
        buildQuestion("q10", course.label + week.grade + "練完後，最應該先確認什麼？", "自己是否掌握了這一級的重點、任務和練習方向", distractors.goal[0], distractors.goal[1], "這份測驗的目的，就是確認學生有沒有吸收到這一級內容。")
      ];
    }

    function updateUrl() {
      history.replaceState(null, "", window.ErhuExamProgress.buildUrl("./二胡小教室-小測驗.html", {
        level: currentLevel,
        grade: currentWeek
      }));
    }

    function scoreCollection() {
      const user = window.ErhuAuth.getCurrentUser();
      return window.ErhuFirebase.db.collection("students").doc(user.uid).collection("quizScores");
    }

    async function loadSavedScore() {
      const ids = window.ErhuExamProgress.scoreDocIds(currentLevel, currentWeek);
      const primarySnapshot = await scoreCollection().doc(ids.primary).get();
      if (primarySnapshot.exists) {
        return primarySnapshot;
      }
      return scoreCollection().doc(ids.legacy).get();
    }

    async function renderScoreHistory() {
      const user = window.ErhuAuth.getCurrentDisplayName();
      const context = currentLevel + currentWeek;
      const snapshot = await loadSavedScore();
      if (context !== currentLevel + currentWeek) return;
      if (!snapshot.exists) {
        scoreHistory.textContent = user + "｜尚未留下這一級的測驗紀錄";
        return;
      }
      const saved = snapshot.data();
      scoreHistory.textContent = user + "｜上次分數：" + saved.lastScore + " / " + saved.total + "｜最佳分數：" + saved.bestScore + " / " + saved.total;
    }

    function renderLevelTabs() {
      levelTabs.innerHTML = "";
      Object.entries(weeklyData).forEach(([key, value]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tab";
        button.setAttribute("aria-pressed", key === currentLevel ? "true" : "false");
        button.textContent = value.label;
        button.addEventListener("click", () => {
          currentLevel = key;
          currentWeek = 1;
          renderQuiz();
        });
        levelTabs.appendChild(button);
      });
    }

    function renderWeekTabs() {
      weekTabs.innerHTML = "";
      weeklyData[currentLevel].weeks.forEach((weekData, index) => {
        const week = index + 1;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "week-tab";
        button.setAttribute("aria-pressed", week === currentWeek ? "true" : "false");
        button.textContent = weekData.grade;
        button.addEventListener("click", () => {
          currentWeek = week;
          renderQuiz();
        });
        weekTabs.appendChild(button);
      });
    }

    async function renderQuiz() {
      const course = weeklyData[currentLevel];
      currentWeek = Math.min(course.weeks.length, Math.max(1, currentWeek));
      renderLevelTabs();
      renderWeekTabs();
      const weekData = course.weeks[currentWeek - 1];
      const questions = buildWeekQuiz(currentLevel, currentWeek - 1);
      document.title = "二胡小教室 | " + course.label + weekData.grade + "級數測驗";
      pageTitle.textContent = course.label + weekData.grade + "級數測驗";
      quizIntro.textContent = "這一份是 " + course.label + weekData.grade + "的 10 題測驗，題目直接對應本級的學習主題、重點與任務。";
      quizMeta.textContent = weekData.title + "｜" + weekData.description;
      updateUrl();
      renderScoreHistory().catch(() => { scoreHistory.textContent = "成績暫時無法載入，仍可作答。"; });
      document.querySelectorAll(".tab").forEach((tab, index) => {
        const key = Object.keys(weeklyData)[index];
        tab.classList.toggle("active", key === currentLevel);
        tab.setAttribute("aria-pressed", key === currentLevel ? "true" : "false");
      });
      document.querySelectorAll(".week-tab").forEach((tab, index) => {
        tab.classList.toggle("active", index + 1 === currentWeek);
        tab.setAttribute("aria-pressed", index + 1 === currentWeek ? "true" : "false");
      });
      quizContainer.innerHTML = "";
      quizResult.textContent = "尚未作答";
      questions.forEach((item, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "question";
        wrapper.dataset.questionId = item.id;
        wrapper.innerHTML = "<p><strong>第 " + (index + 1) + " 題</strong><br>" + item.question + "</p>";
        const options = document.createElement("div");
        options.className = "options";
        item.options.forEach((option, optionIndex) => {
          const label = document.createElement("label");
          label.className = "option";
          label.innerHTML = "<input type=\"radio\" name=\"" + item.id + "\" value=\"" + optionIndex + "\"><span>" + option + "</span>";
          options.appendChild(label);
        });
        wrapper.appendChild(options);
        const feedback = document.createElement("div");
        feedback.className = "feedback";
        wrapper.appendChild(feedback);
        quizContainer.appendChild(wrapper);
      });
      window.currentQuestions = questions;
    }

    document.getElementById("submitQuizButton").addEventListener("click", async () => {
      const submittedLevel = currentLevel, submittedWeek = currentWeek;
      const questionCount = window.currentQuestions.length;
      let score = 0;
      let answered = 0;
      window.currentQuestions.forEach((item) => {
        const checked = document.querySelector("input[name=\"" + item.id + "\"]:checked");
        const questionCard = document.querySelector("[data-question-id=\"" + item.id + "\"]");
        const feedback = questionCard.querySelector(".feedback");
        questionCard.classList.remove("correct", "incorrect");
        feedback.textContent = "";
        feedback.className = "feedback";
        if (checked) {
          answered += 1;
          if (Number(checked.value) === item.answer) {
            score += 1;
            questionCard.classList.add("correct");
            feedback.classList.add("correct");
            feedback.textContent = "答對了：" + item.explanation;
          } else {
            questionCard.classList.add("incorrect");
            feedback.classList.add("incorrect");
            feedback.textContent = "答錯了：" + item.explanation;
          }
        }
      });
      if (answered < window.currentQuestions.length) {
        quizResult.textContent = "你還有題目沒作答，先全部選完再送出。";
        return;
      }
      const submitButton = document.getElementById("submitQuizButton");
      if (submitButton.disabled) return;
      submitButton.disabled = true;
      try {
      const previousSnapshot = await loadSavedScore();
      const previous = previousSnapshot.exists ? previousSnapshot.data() : null;
      const bestScore = previous ? Math.max(previous.bestScore, score) : score;
      const payload = {
        level: submittedLevel,
        grade: submittedWeek,
        week: submittedWeek,
        quizVersion: "20260928-v2",
        lastScore: score,
        bestScore: bestScore,
        total: questionCount,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      const ids = window.ErhuExamProgress.scoreDocIds(submittedLevel, submittedWeek);
      await Promise.all([
        scoreCollection().doc(ids.primary).set(payload, { merge: true }),
        scoreCollection().doc(ids.legacy).set(payload, { merge: true })
      ]);
      if (currentLevel !== submittedLevel || currentWeek !== submittedWeek) return;
      await renderScoreHistory();
      quizResult.textContent = "你的分數是 " + score + " / " + window.currentQuestions.length + "。"
        + (score === window.currentQuestions.length ? " 全對，這一級重點已掌握。" : " 建議回去複習這一級內容，再做一次。");
      } catch (error) { quizResult.textContent = "作答已評分，但雲端保存失敗。請保持此頁，確認連線後重新送出。"; }
      finally { submitButton.disabled = false; }
    });

    document.getElementById("resetQuizButton").addEventListener("click", () => {
      document.querySelectorAll("input[type=\"radio\"]").forEach((input) => { input.checked = false; });
      document.querySelectorAll(".question").forEach((question) => question.classList.remove("correct", "incorrect"));
      document.querySelectorAll(".feedback").forEach((feedback) => {
        feedback.textContent = "";
        feedback.className = "feedback";
      });
      quizResult.textContent = "尚未作答";
    });

    window.ErhuAuth.onReady(function () {
      renderLevelTabs();
      renderWeekTabs();
      renderQuiz();
    });
  </script>
  </main>
</body>
</html>
