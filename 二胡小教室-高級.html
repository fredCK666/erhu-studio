  <style>
    :root { --ink:#191614; --muted:#5f544e; --paper:rgba(250,248,245,0.94); --line:rgba(90,68,51,0.12); --wood:#5d4636; --shadow:0 22px 54px rgba(46,28,18,0.12); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; background:linear-gradient(180deg,#ebe7ef 0%,#faf9f6 40%,#ece2d8 100%); }
    a { color:inherit; text-decoration:none; }
    .shell { width:min(1120px,calc(100% - 28px)); margin:0 auto; padding:24px 0 40px; }
    .hero,.week-card,.tools,.chart-card { background:var(--paper); border:1px solid var(--line); border-radius:28px; box-shadow:var(--shadow); }
    .hero { padding:28px; margin-bottom:18px; }
    h1 { margin:0 0 10px; font-size:clamp(30px,5vw,46px); }
    p { color:var(--muted); line-height:1.8; }
    .weeks { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .week-card { display:block; padding:20px; transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease; }
    .week-card ul { margin:12px 0 0; padding-left:20px; color:var(--muted); }
    .tag { display:inline-flex; margin-bottom:10px; padding:6px 10px; border-radius:999px; background:rgba(93,70,54,0.1); color:var(--wood); font-size:13px; font-weight:800; }
    .week-card h2 { margin:0 0 10px; font-size:24px; }
    .week-card:hover { transform: translateY(-2px); border-color: rgba(93,70,54,0.24); }
    .chart-card { margin-top:18px; padding:22px; }
    .syllabus-list { display:grid; gap:14px; margin-top:14px; }
    .syllabus-item { padding:18px; border-radius:20px; background:#fffdf8; border:1px solid rgba(93,70,54,0.1); }
    .syllabus-item h3 { margin:0 0 10px; font-size:22px; }
    .piece-row { margin-top:8px; color:var(--muted); line-height:1.8; }
    .piece-row span { display:inline-block; margin-right:8px; color:var(--wood); font-weight:800; }
    .tools { margin-top:18px; padding:22px; }
    .tools a { color:var(--wood); font-weight:800; }
    @media (max-width:860px) { .weeks { grid-template-columns:1fr; } }
  </style>
<link rel="stylesheet" href="./erhu-refined.css?v=20260928" />

<body class="erhu-site">
  <main class="shell">
    <header class="topbar">
      <div class="brand">二胡小教室</div>
      <nav class="nav">
        <a href="./">回首頁</a>
        <a href="./二胡小教室.html#course-levels">課程分級</a>
        <a href="./二胡小教室-AI練習規劃師.html">AI 規劃</a>
        <a href="./二胡小教室-練習打卡.html">檢定打卡</a>
      </nav>
      <a class="tuner-shortcut" href="./二胡小教室-調音器.html">調音器</a>
    </header>
    <section class="hero">
      <h1>高級檢定課程</h1>
      <p>這一頁對應二胡檢定的高級級別，也就是第八級到第十級。這三個級別都沒有指定曲，重點是選好自選曲後，把技巧、風格和整體演出穩定度做出來。</p>
    </section>
    <section class="weeks" id="weeksContainer"></section>
    <section class="chart-card">
      <h2>高級三級課程安排</h2>
      <p>這裡把第八級到第十級的考曲方向和準備重點整理成文字版，方便直接對照練習。</p>
      <div class="syllabus-list" id="syllabusList"></div>
    </section>
    <section class="tools">
      搭配工具：
      <a href="./二胡小教室-影片.html">示範教材</a>、
      <a href="./二胡小教室-練習打卡.html">檢定打卡</a>、
      <a href="./二胡小教室-小測驗.html?level=advanced">級數測驗</a>、
      <a href="./二胡小教室-AI練習規劃師.html?level=advanced">AI 規劃</a>、
      <a href="./二胡小教室-AI助教.html?level=advanced&amp;grade=1">AI 助教</a>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./exam-course-data.js?v=20260505c"></script>
  <script src="./exam-progress.js?v=20260519a"></script>
  <script src="./firebase-init.js?v=20260928"></script>
  <script src="./auth.js?v=20260928"></script>
  <script>
    window.ErhuAuth.requireAuth();
    window.ErhuAuth.attachAuthUI();

    const course = window.ErhuExamData.levels.advanced;
    const weeksContainer = document.getElementById("weeksContainer");
    const syllabusList = document.getElementById("syllabusList");

    course.grades.forEach(function (item, index) {
      const card = document.createElement("a");
      card.className = "week-card";
      card.href = window.ErhuExamProgress.buildUrl("./二胡小教室-週課程.html", { level: "advanced", grade: index + 1 });
      card.innerHTML =
        "<div class=\"tag\">" + item.grade + "</div>" +
        "<h2>" + item.shortTitle + "</h2>" +
        "<p>" + item.description + "</p>" +
        "<ul><li>指定曲：" + item.specified + "</li><li>自選曲：" + item.selected.join("、") + "</li></ul>";
      weeksContainer.appendChild(card);

      const entry = document.createElement("article");
      entry.className = "syllabus-item";
      entry.innerHTML =
        "<h3>" + item.grade + "｜" + item.shortTitle + "</h3>" +
        "<p>" + item.note + "</p>" +
        "<div class=\"piece-row\"><span>指定曲</span>" + item.specified + "</div>" +
        "<div class=\"piece-row\"><span>自選曲</span>" + item.selected.join("、") + "</div>" +
        "<div class=\"piece-row\"><span>準備重點</span>" + item.focus.join(" / ") + "</div>";
      syllabusList.appendChild(entry);
    });
  </script>
</body>
</html>
