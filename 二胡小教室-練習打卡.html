    <section class="panel">
      <h1>檢定級數打卡</h1>
      <p>初級、中級、高級各自分開打卡。你切換等級後，勾選的內容會各自保存在不同紀錄，不會互相覆蓋，登入不同學生也會透過 Firebase 分開同步保存。卡住時也可以直接進 AI 助教問這一級怎麼練。</p>
      <div class="tabs" id="levelTabs"></div>
      <div class="tracker-grid" id="trackerGrid"></div>
      <div class="summary" id="trackerSummary">目前完成 0 / 0 級</div>
      <button class="button" id="resetTrackerButton" type="button">清除目前等級打卡</button>
    </section>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./firebase-init.js?v=20260928"></script>
  <script src="./auth.js?v=20260928"></script>
  <script src="./exam-course-data.js?v=20260505c"></script>
  <script src="./exam-progress.js?v=20260519a"></script>
  <script>
    window.ErhuAuth.requireAuth();
    window.ErhuAuth.attachAuthUI();
    const courseTracks = {
      beginner: { label: "初級", items: window.ErhuExamData.levels.beginner.grades.map(function (item) {
        return { grade: item.grade, text: "完成" + item.grade + "｜" + item.shortTitle };
      })},
      intermediate: { label: "中級", items: window.ErhuExamData.levels.intermediate.grades.map(function (item) {
        return { grade: item.grade, text: "完成" + item.grade + "｜" + item.shortTitle };
      })},
      advanced: { label: "高級", items: window.ErhuExamData.levels.advanced.grades.map(function (item) {
        return { grade: item.grade, text: "完成" + item.grade + "｜" + item.shortTitle };
      })}
    };

    let currentLevel = "beginner";
    const levelTabs = document.getElementById("levelTabs");
    const trackerGrid = document.getElementById("trackerGrid");
    const trackerSummary = document.getElementById("trackerSummary");

    function trackerRef() {
      const user = window.ErhuAuth.getCurrentUser();
      return window.ErhuFirebase.db.collection("students").doc(user.uid).collection("trackers").doc(currentLevel);
    }

    function renderTabs() {
      levelTabs.innerHTML = "";
      Object.entries(courseTracks).forEach(([key, value]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tab";
        button.setAttribute("aria-pressed", key === currentLevel ? "true" : "false");
        button.textContent = value.label;
        button.addEventListener("click", () => setLevel(key));
        levelTabs.appendChild(button);
      });
    }

    async function renderTracker() {
      const snapshot = await trackerRef().get();
      const saved = snapshot.exists ? snapshot.data() : {};
      trackerGrid.innerHTML = "";
      courseTracks[currentLevel].items.forEach((itemData, index) => {
        const gradeIndex = index + 1;
        const wrap = document.createElement("div");
        wrap.className = "tracker-item";
        const checked = window.ErhuExamProgress.isCompleted(saved, gradeIndex);
        wrap.innerHTML = "<strong>" + itemData.grade + "</strong><label><input type=\"checkbox\" data-grade=\"" + gradeIndex + "\"" + (checked ? " checked" : "") + " /> " + itemData.text + "</label>";
        trackerGrid.appendChild(wrap);
      });
      bindTrackerEvents();
      updateSummary();
    }

    function bindTrackerEvents() {
      trackerGrid.querySelectorAll("[data-grade]").forEach((checkbox) => {
        checkbox.addEventListener("change", saveTracker);
      });
    }

    async function saveTracker() {
      const state = window.ErhuExamProgress.buildTrackerPayload(
        courseTracks[currentLevel].items.length,
        function (gradeIndex) {
          const checkbox = trackerGrid.querySelector("[data-grade=\"" + gradeIndex + "\"]");
          return checkbox ? checkbox.checked : false;
        }
      );
      state.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
      await trackerRef().set(state, { merge: true });
      updateSummary();
    }

    function updateSummary() {
      const checkboxes = Array.from(trackerGrid.querySelectorAll("[data-grade]"));
      const completed = checkboxes.filter((checkbox) => checkbox.checked).length;
      const user = window.ErhuAuth.getCurrentDisplayName();
      trackerSummary.textContent = user + "｜" + courseTracks[currentLevel].label + "目前完成 " + completed + " / " + checkboxes.length + " 級";
    }

    function setLevel(levelKey) {
      currentLevel = levelKey;
      document.querySelectorAll(".tab").forEach((tab, index) => {
        const key = Object.keys(courseTracks)[index];
        tab.classList.toggle("active", key === levelKey);
        tab.setAttribute("aria-pressed", key === levelKey ? "true" : "false");
      });
      renderTracker();
    }

    document.getElementById("resetTrackerButton").addEventListener("click", () => {
      trackerGrid.querySelectorAll("[data-grade]").forEach((checkbox) => {
        checkbox.checked = false;
      });
      saveTracker();
    });

    window.ErhuAuth.onReady(function () {
      renderTabs();
      setLevel("beginner");
    });
  </script>
