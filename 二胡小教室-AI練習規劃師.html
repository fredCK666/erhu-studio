    :root {
      --ink: #231812;
      --muted: #6d5b4e;

    a { color: inherit; text-decoration: none; }

    .shell {
      width: min(1360px, calc(100% - 24px));
      margin: 0 auto;
      padding: 24px 0 42px;
    }

    .hero,
    .panel,
    .summary-card,
    .plan-card {
      background: var(--paper);

    .eyebrow {

      border-radius: 999px;

      color: var(--wood);
      font-size: 13px;

      letter-spacing: 0.06em;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 5vw, 54px);
    }

    h2 {

    p {
      margin: 0;

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(360px, 0.75fr);
      gap: 16px;
      align-items: start;
    }

    .panel {

    }

    .planner-section + .planner-section {
      margin-top: 22px;
    }

    .planner-label {
      display: block;
      margin-bottom: 10px;
      color: var(--wood);
      font-size: 15px;
      font-weight: 900;
    }

    .tabs,
    .week-tabs,
    .chip-grid,
    .minute-row {
      display: flex;

    }

    .tab,
    .week-tab,
    .chip,
    .minute-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;

      border-radius: 999px;
      border: 1px solid rgba(123, 77, 45, 0.14);

      color: var(--wood);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .tab.active,
    .week-tab.active,
    .chip.active,
    .minute-button.active {
      border-color: transparent;
      background: linear-gradient(135deg, #cda37c, #9b6b45);
      color: #fffaf6;
      box-shadow: 0 12px 22px rgba(101, 67, 43, 0.16);

    .week-tab {
      min-width: 80px;
      padding: 10px 14px;

    textarea {
      width: 100%;
      min-height: 132px;
      padding: 16px 18px;

    .button.primary {
      background: linear-gradient(135deg, #cda37c, #9b6b45);

    .summary-stack {

    .plan-card {

    .plan-empty,

    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;

        padding: 20px;
      }

        width: 100%;
      }
    }

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

  <script src="./exam-progress.js?v=20260519a"></script>
  <script>
    window.ErhuAuth.requireAuth();
    window.ErhuAuth.attachAuthUI();

    const plannerData = {
      beginner: {
        label: "初級",
        weeks: window.ErhuExamData.levels.beginner.grades.map(function (item) {
          return { grade: item.grade, title: item.shortTitle, description: item.description };
        })
      },
      intermediate: {
        label: "中級",
        weeks: window.ErhuExamData.levels.intermediate.grades.map(function (item) {
          return { grade: item.grade, title: item.shortTitle, description: item.description };
        })
      },
      advanced: {
        label: "高級",
        weeks: window.ErhuExamData.levels.advanced.grades.map(function (item) {
          return { grade: item.grade, title: item.shortTitle, description: item.description };
        })
      }
    };

    const minuteOptions = [15, 25, 35, 45];
    const focusOptions = ["音準", "節奏", "弓法", "音色", "換把", "流暢度"];
    const params = new URLSearchParams(window.location.search);
    let currentUser = null;
    let learningProfile = null;
    let currentLevel = plannerData[params.get("level")] ? params.get("level") : "beginner";
    let currentWeek = Math.min(plannerData[currentLevel].weeks.length, window.ErhuExamProgress.getGradeNumber(params, 1));
    let currentMinutes = minuteOptions.includes(Number(params.get("minutes"))) ? Number(params.get("minutes")) : 25;
    const selectedFocus = new Set();

    const levelTabs = document.getElementById("levelTabs");
    const weekTabs = document.getElementById("weekTabs");
    const minuteRow = document.getElementById("minuteRow");
    const focusGrid = document.getElementById("focusGrid");
    const weekBrief = document.getElementById("weekBrief");
    const blockerInput = document.getElementById("blockerInput");
    const plannerStatus = document.getElementById("plannerStatus");
    const summaryList = document.getElementById("summaryList");
    const planEmpty = document.getElementById("planEmpty");
    const planOutput = document.getElementById("planOutput");
    const planMeta = document.getElementById("planMeta");
    const generateButton = document.getElementById("generateButton");
    const reuseButton = document.getElementById("reuseButton");

    function plannerRef() {
      return window.ErhuFirebase.db.collection("students").doc(currentUser.uid).collection("aiPracticePlans").doc("main");
    }

    function clampWeek(levelKey, weekValue) {
      const total = plannerData[levelKey].weeks.length;
      return Math.min(total, Math.max(1, Number(weekValue) || 1));
    }

    function currentGradeData() {
      return plannerData[currentLevel].weeks[currentWeek - 1];
    }

    function updateUrl() {
      const nextUrl = window.ErhuExamProgress.buildUrl("./二胡小教室-AI練習規劃師.html", {
        level: currentLevel,
        grade: currentWeek,
        minutes: currentMinutes
      });
      history.replaceState(null, "", nextUrl);
    }

    function setStatus(text) {
      plannerStatus.textContent = "目前狀態：" + text;
    }

    function renderLevelTabs() {
      levelTabs.innerHTML = "";
      Object.entries(plannerData).forEach(function (entry) {
        const key = entry[0];
        const value = entry[1];
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tab" + (key === currentLevel ? " active" : "");
        button.setAttribute("aria-pressed", key === currentLevel ? "true" : "false");
        button.textContent = value.label;
        button.addEventListener("click", function () {
          currentLevel = key;
          currentWeek = 1;
          renderLevelTabs();
          renderWeekTabs();
          updateSummary();
          updateUrl();
        });
        levelTabs.appendChild(button);
      });
    }

    function renderWeekTabs() {
      weekTabs.innerHTML = "";
      plannerData[currentLevel].weeks.forEach(function (weekData, index) {
        const weekNumber = index + 1;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "week-tab" + (weekNumber === currentWeek ? " active" : "");
        button.setAttribute("aria-pressed", weekNumber === currentWeek ? "true" : "false");
        button.textContent = weekData.grade;
        button.addEventListener("click", function () {
          currentWeek = weekNumber;
          renderWeekTabs();
          updateSummary();
          updateUrl();
        });
        weekTabs.appendChild(button);
      });
      currentWeek = clampWeek(currentLevel, currentWeek);
      const weekData = currentGradeData();
      weekBrief.textContent = plannerData[currentLevel].label + "｜" + weekData.grade + "｜" + weekData.title + "：" + weekData.description;
    }

    function renderMinuteButtons() {
      minuteRow.innerHTML = "";
      minuteOptions.forEach(function (minutes) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "minute-button" + (minutes === currentMinutes ? " active" : "");
        button.textContent = minutes + " 分鐘";
        button.addEventListener("click", function () {
          currentMinutes = minutes;
          renderMinuteButtons();
          updateUrl();
        });
        minuteRow.appendChild(button);
      });
    }

    function renderFocusButtons() {
      focusGrid.innerHTML = "";
      focusOptions.forEach(function (focus) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "chip" + (selectedFocus.has(focus) ? " active" : "");
        button.textContent = focus;
        button.addEventListener("click", function () {
          if (selectedFocus.has(focus)) {
            selectedFocus.delete(focus);
          } else {
            selectedFocus.add(focus);
          }
          renderFocusButtons();
        });
        focusGrid.appendChild(button);
      });
    }

    async function loadLearningProfile() {
      const studentRef = window.ErhuFirebase.db.collection("students").doc(currentUser.uid);
      const trackerSnapshot = await studentRef.collection("trackers").get();
      const quizSnapshot = await studentRef.collection("quizScores").get();
      const trackerSummary = {};
      trackerSnapshot.forEach(function (doc) {
        const data = doc.data() || {};
        const totalGrades = plannerData[doc.id] ? plannerData[doc.id].weeks.length : 10;
        trackerSummary[doc.id] = window.ErhuExamProgress.countCompleted(data, totalGrades);
      });
      const quizSummary = {};
      const quizEntries = {};
      quizSnapshot.forEach(function (doc) {
        const data = doc.data() || {};
        const parsed = window.ErhuExamProgress.parseScoreDocId(doc.id);
        if (!parsed) return;
        const levelKey = parsed.level;
        if (!quizEntries[levelKey]) {
          quizEntries[levelKey] = {};
        }
        const current = quizEntries[levelKey][parsed.grade];
        if (!current || (current.variant === "week" && parsed.variant === "grade")) {
          quizEntries[levelKey][parsed.grade] = {
            variant: parsed.variant,
            data: data
          };
        }
      });
      Object.keys(quizEntries).forEach(function (levelKey) {
        quizSummary[levelKey] = { best: 0, last: null, weakWeeks: [] };
        Object.keys(quizEntries[levelKey]).sort(function (a, b) {
          return Number(a) - Number(b);
        }).forEach(function (gradeKey) {
          const data = quizEntries[levelKey][gradeKey].data || {};
          if (typeof data.bestScore === "number" && data.bestScore > quizSummary[levelKey].best) {
            quizSummary[levelKey].best = data.bestScore;
          }
          if (typeof data.lastScore === "number") {
            quizSummary[levelKey].last = data.lastScore;
            if (data.lastScore < 8) {
              const gradeData = plannerData[levelKey] && plannerData[levelKey].weeks[Number(gradeKey) - 1];
              const label = gradeData ? gradeData.grade : ("第 " + gradeKey + " 級");
              quizSummary[levelKey].weakWeeks.push(label + " " + data.lastScore + "/10");
            }
          }
        });
      });
      return {
        displayName: currentUser.displayName,
        trackerSummary: trackerSummary,
        quizSummary: quizSummary
      };
    }

    function updateSummary() {
      currentWeek = clampWeek(currentLevel, currentWeek);
      const weekData = currentGradeData();
      const tracker = learningProfile && learningProfile.trackerSummary ? learningProfile.trackerSummary[currentLevel] : null;
      const quiz = learningProfile && learningProfile.quizSummary ? learningProfile.quizSummary[currentLevel] : null;
      const weakWeeks = quiz && Array.isArray(quiz.weakWeeks) && quiz.weakWeeks.length
        ? quiz.weakWeeks.join("、")
        : "目前沒有明顯弱項級數";
      const userName = currentUser ? currentUser.displayName : "目前學生";
      summaryList.innerHTML =
        "<div class=\"summary-item\"><strong>目前學生</strong><br>" + userName + "</div>" +
        "<div class=\"summary-item\"><strong>本次規劃</strong><br>" + plannerData[currentLevel].label + "｜" + weekData.grade + "｜" + weekData.title + "</div>" +
        "<div class=\"summary-item\"><strong>打卡進度</strong><br>" + (typeof tracker === "number" ? tracker + " / " + plannerData[currentLevel].weeks.length + " 級已完成" : "尚未留下打卡資料") + "</div>" +
        "<div class=\"summary-item\"><strong>測驗狀態</strong><br>最近一次：" + (quiz && quiz.last != null ? quiz.last + "/10" : "尚無資料") + "｜最佳：" + (quiz && quiz.best != null ? quiz.best + "/10" : "尚無資料") + "</div>" +
        "<div class=\"summary-item\"><strong>AI 會特別參考</strong><br>" + weakWeeks + "</div>" +
        "<div class=\"summary-item\"><strong>本級主題</strong><br>" + weekData.description + "</div>";
    }

    function renderPlan(text, metaText) {
      planEmpty.hidden = true;
      planOutput.hidden = false;
      planOutput.innerHTML = ErhuQuality.markdown(text);
      planMeta.textContent = metaText;
    }

    async function saveLatestPlan(text) {
      await plannerRef().set({
        latestPlan: {
          text: text,
          version: "20260928-v2",
          level: currentLevel,
          grade: currentWeek,
          week: currentWeek,
          minutes: currentMinutes,
          focusAreas: Array.from(selectedFocus),
          blocker: blockerInput.value.trim(),
          createdAt: new Date().toISOString()
        },
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }

    async function loadLatestPlan() {
      const snapshot = await plannerRef().get();
      if (!snapshot.exists) return;
      const data = snapshot.data() || {};
      const latestPlan = data.latestPlan;
      if (!latestPlan || !latestPlan.text) return;
      if (!params.has("level") && plannerData[latestPlan.level]) {
        currentLevel = latestPlan.level;
      }
      if (!params.has("grade") && !params.has("week")) {
        currentWeek = clampWeek(currentLevel, latestPlan.grade || latestPlan.week);
      }
      if (!params.has("minutes") && minuteOptions.indexOf(latestPlan.minutes) >= 0) {
        currentMinutes = latestPlan.minutes;
      }
      selectedFocus.clear();
      if (Array.isArray(latestPlan.focusAreas)) {
        latestPlan.focusAreas.forEach(function (item) {
          if (focusOptions.indexOf(item) >= 0) selectedFocus.add(item);
        });
      }
      blockerInput.value = latestPlan.blocker || "";
      renderLevelTabs();
      renderWeekTabs();
      renderMinuteButtons();
      renderFocusButtons();
      const latestLevel = plannerData[latestPlan.level] ? latestPlan.level : currentLevel;
      const latestWeek = clampWeek(latestLevel, latestPlan.week);
      const latestGrade = plannerData[latestLevel].weeks[latestWeek - 1];
      renderPlan(latestPlan.version === "20260928-v2" ? latestPlan.text : "這份舊計畫尚未通過時間加總檢查，請重新生成。", "上次生成 " + ErhuQuality.date(latestPlan.createdAt) + "｜" + plannerData[latestLevel].label + " " + latestGrade.grade + "｜" + latestPlan.minutes + " 分鐘");
    }

    async function askPlannerBackend() {
      const firebaseUser = window.ErhuFirebase.auth.currentUser;
      if (!firebaseUser) {
        throw new Error("missing-auth-session");
      }
      const idToken = await firebaseUser.getIdToken();
      const response = await fetch(window.ErhuFirebase.functionsBaseUrl + (window.ErhuFirebase.qualityAi ? "/askErhuPracticePlannerV2" : "/askErhuPracticePlanner"), {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + idToken
        },
        body: JSON.stringify({
          level: currentLevel,
          grade: currentWeek,
          week: currentWeek,
          minutes: currentMinutes,
          focusAreas: Array.from(selectedFocus),
          blocker: blockerInput.value.trim(),
          course: currentGradeData(),
          studentProfile: learningProfile
        })
      });
      const data = await response.json();
      if (!response.ok || !data.answer) {
        throw new Error(data && data.error ? data.error : "planner-failed");
      }
      if (Array.isArray(data.tasks) && data.tasks.length) return ErhuQuality.planText(currentMinutes, data.tasks);
      // Older backends return prose with unchecked durations. Do not publish inconsistent totals.
      const tasks = [
        {title:"暖身與長弓",instruction:"保持肩膀放鬆，用舒適速度做空弦長弓。",minutes:1},
        {title:Array.from(selectedFocus).join("、") || "本級重點",instruction:"依本級教材挑兩小節慢練，確認音準與節拍再連接。",minutes:2},
        {title:"整合與回顧",instruction:"完整拉一次，記下一個需要再練的地方。",minutes:1}
      ];
      return ErhuQuality.planText(currentMinutes,tasks)+"\n\n此為系統時間表；本次 AI 未回傳可驗證的分段格式。";
    }

    async function generatePlan() {
      generateButton.disabled = true;
      reuseButton.disabled = true;
      generateButton.textContent = "生成中...";
      setStatus("AI 正在安排今天的練習流程");
      try {
        const text = await askPlannerBackend();
        const metaText = plannerData[currentLevel].label + "｜" + currentGradeData().grade + "｜" + currentMinutes + " 分鐘";
        renderPlan(text, metaText);
        await saveLatestPlan(text);
        setStatus("已生成完成");
      } catch (error) {
        console.error("generatePlan failed", error);
        setStatus("生成失敗，請再試一次");
        planEmpty.hidden = false;
        planOutput.hidden = true;
        planEmpty.textContent = "這次尚未生成練習計畫，請再按一次。若連續失敗，請確認登入狀態後再試。";
      } finally {
        generateButton.disabled = false;
        reuseButton.disabled = false;
        generateButton.textContent = "生成今日練習計畫";
      }
    }

    generateButton.addEventListener("click", generatePlan);
    reuseButton.addEventListener("click", function () {
      generatePlan();
    });

    window.ErhuAuth.onReady(async function (user) {
      currentUser = user;
      learningProfile = await loadLearningProfile();
      renderLevelTabs();
      renderWeekTabs();
      renderMinuteButtons();
      renderFocusButtons();
      updateSummary();
      await loadLatestPlan();
      updateSummary();
      setStatus("可以開始生成今天的練習計畫");
      updateUrl();
    });
  </script>
</body>
</html>
